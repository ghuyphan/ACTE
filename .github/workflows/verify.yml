name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Lint, Test, and Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint:ci

      - name: Theme Audit
        run: npm run theme:audit

      - name: Typecheck
        run: npm run typecheck

      - name: Supabase Function Check
        run: npm run supabase:functions:check

      - name: Tests
        run: npm test -- --ci --runInBand

      - name: Expo Doctor
        run: npm run expo:doctor

      - name: Production Dependency Audit
        run: npm run audit:prod
